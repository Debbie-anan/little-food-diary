<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f7df" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Memorable" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Memorable · 生活照片手账</title>
  <style>
    @font-face {
      font-family: "Memorable Hand";
      src: url("./assets/fonts/memorable-hand.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Memorable Latin";
      src: url("./assets/fonts/memorable-latin.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Memorable Pencil";
      src: url("./assets/fonts/memorable-pencil.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Memorable Signature";
      src: url("./assets/fonts/memorable-signature.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --ink: #302d2b;
      --muted: #8e877f;
      --paper: #fff9ed;
      --card: #fffdf8;
      --berry: #ff6d76;
      --berry-dark: #e95560;
      --matcha: #8abf79;
      --yolk: #ffc95a;
      --line: #e9dfce;
      --shadow: 0 16px 45px rgba(90, 72, 49, .11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Patrick Hand", "Long Cang", cursive;
      background:
        radial-gradient(circle at 7% 8%, rgba(255, 201, 90, .22) 0 75px, transparent 76px),
        radial-gradient(circle at 93% 30%, rgba(138, 191, 121, .16) 0 115px, transparent 116px),
        var(--paper);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E");
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .shell { width: min(1120px, calc(100% - 34px)); margin: 0 auto; padding: 28px 0 96px; }

    nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 56px; }
    .brand { display: flex; align-items: center; gap: 12px; font-family: "Long Cang", "Patrick Hand", cursive; font-size: 27px; letter-spacing: .04em; transform: rotate(-1deg); }
    .brand-mark {
      width: 42px; height: 42px; display: grid; place-items: center;
      border: 2px solid var(--ink); border-radius: 50% 48% 46% 52%;
      background: var(--yolk); box-shadow: 3px 3px 0 var(--ink); transform: rotate(-5deg);
    }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .date-pill, .lang-btn { color: var(--muted); font-size: 16px; padding: 8px 14px; border: 1.5px solid var(--ink); border-radius: 48% 52% 45% 55%; background: rgba(255,255,255,.65); }
    .lang-btn { color: var(--ink); font-weight: 800; transition: .2s; }
    .lang-btn:hover { background: var(--yolk); transform: rotate(-2deg); }
    .install-btn { display: none; align-items: center; gap: 6px; padding: 9px 14px; border: 1.5px solid var(--ink); border-radius: 99px; color: #fff; background: var(--ink); font-weight: 800; font-size: 13px; box-shadow: 2px 3px 0 var(--berry); }
    .install-btn.ready { display: inline-flex; animation: installPop .45s cubic-bezier(.2,.9,.3,1.3); }
    .account-btn { padding: 9px 14px; border: 1.5px solid var(--ink); border-radius: 99px; color: var(--ink); background: var(--yolk); font-weight: 700; font-size: 14px; box-shadow: 2px 3px 0 var(--ink); }
    .account-btn.signed-in { background: var(--matcha); }

    .hero { display: block; margin-bottom: 48px; }
    .camera-dock { position: fixed; right: max(22px, env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 90; }
    .camera-dock .upload-btn { width: 64px; height: 64px; background: var(--berry); box-shadow: 4px 5px 0 var(--ink); }
    .camera-dock .upload-btn svg { width: 32px; height: 32px; }
    .camera-menu { position: absolute; right: 0; bottom: 82px; width: 190px; padding: 10px; border: 1.5px solid var(--ink); border-radius: 19px 16px 20px 14px; background: var(--paper); box-shadow: 4px 5px 0 var(--ink); }
    .camera-menu[hidden] { display: none; }
    .camera-menu button { display: block; width: 100%; padding: 12px; border: 0; border-radius: 12px; text-align: left; background: transparent; color: var(--ink); font-size: 17px; text-decoration: none; }
    .camera-menu button:hover { background: #ffedc6; }
    .calendar-card { padding: 28px 18px 20px; }
    .calendar-head { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 15px; }
    .calendar-head h3 { margin: 0; font-size: 24px; font-weight: 400; }
    .calendar-head button { border: 0; background: transparent; font-size: 25px; color: var(--ink); padding: 5px 12px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; text-align: center; }
    .calendar-weekdays { margin-bottom: 8px; color: var(--muted); font-size: 13px; }
    .calendar-day { min-height: 53px; border: 1px solid transparent; border-radius: 13px; background: transparent; color: var(--ink); font-size: 17px; }
    .calendar-day:hover, .calendar-day.selected { background: #ffedc6; }
    .calendar-day.today { border-color: var(--berry); }
    .calendar-day .smile { display: block; height: 19px; color: var(--berry-dark); font-size: 20px; line-height: 19px; }
    .eyebrow { color: var(--berry-dark); font-weight: 700; font-size: 15px; letter-spacing: .13em; text-transform: uppercase; transform: rotate(-1deg); transform-origin: left; }
    h1 { margin: 10px 0 18px; font-family: "Long Cang", "Patrick Hand", cursive; font-size: clamp(64px, 8vw, 105px); line-height: .92; letter-spacing: .01em; font-weight: 400; transform: rotate(-.6deg); transform-origin: left; }
    h1 span { position: relative; color: var(--berry); font-family: "Long Cang", "Patrick Hand", cursive; font-weight: 400; letter-spacing: .02em; }
    h1 span::after { content: ""; position: absolute; height: 8px; left: 4%; right: -2%; bottom: -2px; border-radius: 50%; background: var(--yolk); z-index: -1; transform: rotate(-2deg); }
    .intro { max-width: 520px; font-size: 21px; line-height: 1.55; color: #69615a; }

    .stats { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
    .stat { min-width: 120px; padding: 14px 17px; border: 1px solid var(--line); background: rgba(255,255,255,.5); border-radius: 18px; }
    .stat strong { display: block; font-size: 23px; letter-spacing: -.04em; }
    .stat span { color: var(--muted); font-size: 15px; }

    .upload-card {
      position: relative; min-height: 230px; padding: 28px 22px 22px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
      border: 2px solid var(--ink); border-radius: 42% 48% 44% 50%;
      background: rgba(138,191,121,.78); box-shadow: 8px 9px 0 var(--ink);
      transform: rotate(1.4deg); transition: transform .25s ease;
    }
    .upload-card:hover { transform: rotate(0deg) translateY(-3px); }
    .doodle { position: absolute; font-family: "Long Cang", "Patrick Hand", cursive; color: rgba(48,45,43,.78); }
    .doodle.one { position: static; font-size: 23px; text-align: center; transform: rotate(-3deg); }
    .doodle.two { right: 18px; top: 16px; font-size: 30px; transform: rotate(12deg); }
    .upload-btn { position: relative; z-index: 2; width: 86px; height: 86px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 50% 46% 52% 48%; padding: 0; color: #fff; background: var(--ink); box-shadow: 5px 6px 0 rgba(255,255,255,.55); transition: .2s ease; }
    .upload-btn svg { width: 42px; height: 42px; }
    .upload-btn:hover { background: var(--berry); transform: translateY(-2px); }
    .upload-btn:disabled { cursor: wait; opacity: .72; transform: none; }
    .upload-btn.busy svg { animation: cameraBusy .9s ease-in-out infinite alternate; }
    .gallery-btn { border: 0; padding: 5px 10px; color: var(--ink); background: transparent; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; }
    #fileInput, #cameraInput { display: none; }
    .moment-card input[type="datetime-local"] { width: 100%; padding: 13px 14px; border: 1.5px solid var(--ink); border-radius: 14px; background: #fff; color: var(--ink); font-size: 17px; }

    .notebook { position: relative; padding: 34px 34px 30px 52px; border: 1px solid #dfd2bf; border-radius: 12px 26px 26px 12px; background: repeating-linear-gradient(to bottom, #fffdf8 0, #fffdf8 37px, #eadfcd 38px); box-shadow: 10px 12px 0 #dfcdb5, var(--shadow); min-height: 360px; }
    .notebook::before { content: ""; position: absolute; left: 23px; top: 0; bottom: 0; width: 2px; background: rgba(255,109,118,.28); }
    .rings { position: absolute; left: -10px; top: 34px; bottom: 34px; display: flex; flex-direction: column; justify-content: space-around; }
    .rings i { display: block; width: 31px; height: 10px; border: 3px solid var(--ink); border-radius: 99px; background: #f4e7d1; box-shadow: 2px 2px 0 rgba(48,45,43,.18); }
    .page-corner { position: absolute; right: 0; bottom: 0; width: 54px; height: 54px; border-radius: 28px 0 24px 0; background: linear-gradient(135deg, #efe1cb 50%, transparent 51%); opacity: .75; }
    .section-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 27px; }
    .section-head > div:first-child { flex: 1; min-width: 0; }
    .section-head h2 { margin: 0; white-space: nowrap; font-family: "Long Cang", "Patrick Hand", cursive; font-size: 25px; font-weight: 400; letter-spacing: .01em; transform: rotate(-.5deg); transform-origin: left; }
    .section-head p { margin: 3px 0 0; color: var(--muted); font-size: 17px; }
    .page-tools { display: flex; align-items: center; gap: 12px; }
    .clear-btn, .time-toggle { border: 0; background: transparent; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 4px; }
    .time-toggle { color: var(--berry-dark); }
    .view-tabs { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .view-tabs button { border: 1px solid var(--ink); border-radius: 12px 14px 10px 13px; padding: 7px 12px; background: var(--card); color: var(--ink); }
    .notebook-head { display: grid; grid-template-columns: minmax(0, 1fr) 44px; column-gap: 12px; margin-bottom: 20px; }
    .notebook-head .view-tabs { grid-column: 1; grid-row: 1; }
    .notebook-head .section-head { grid-column: 1; grid-row: 2; margin-bottom: 0; }
    .notebook-icons { grid-column: 2; grid-row: 1 / 3; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    #calendarBtn, #timeToggle { display: grid; place-items: center; width: 44px; height: 44px; min-width: 44px; padding: 5px; border: 0; background: transparent; box-shadow: none; color: var(--ink); border-radius: 12px; text-decoration: none; }
    .notebook-icons svg { width: 29px; height: 29px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    #calendarBtn svg { transform: rotate(-3deg); }
    #timeToggle svg { transform: rotate(3deg); }
    .notebook-icons button:hover { background: #ffce5c33; }
    #timeToggle[aria-pressed="true"] { opacity: .55; }
    #calendarBtn:focus-visible, #timeToggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .view-tabs button[aria-pressed="true"] { background: var(--yolk); box-shadow: 2px 3px 0 var(--ink); }
    .view-tabs button[data-view] { border: 0; background: transparent; box-shadow: none; padding: 7px 10px; }
    .view-tabs button[data-view][aria-pressed="true"] { background: #ffce5c55; box-shadow: none; }
    .meals.collage { position: relative; display: block; height: clamp(360px, 65svh, 680px); padding: 0; }
    .collage .meal-card { position: absolute; min-height: 0; min-width: 0; display: flex; flex-direction: column; padding: 4px; background: var(--card); box-shadow: 2px 5px 10px #302d2b30; border: 1px solid var(--line); border-radius: 3px; opacity: 1; animation: none; transform: translate(-50%, -50%) rotate(var(--tilt)); transition: transform .2s; }
    .collage .meal-card:hover, .collage .meal-card:focus-within { z-index: 20; transform: translate(-50%, -50%) rotate(0deg) scale(1.12); }
    .collage .meal-card { touch-action: none; user-select: none; cursor: grab; }
    .collage .photo-wrap { cursor: grab; }
    .collage img { pointer-events: none; -webkit-user-drag: none; }
    .collage .meal-card.dragging { z-index: 100; cursor: grabbing; transform: translate(-50%, -50%) rotate(0deg); transition: none; }
    .collage .photo-wrap { flex: 1; min-height: 0; aspect-ratio: auto; border: 0; border-radius: 2px; box-shadow: none; }
    .collage .caption { padding: 3px 0 0; }
    .collage .caption strong { display: none; }
    .collage .caption time { width: 100%; text-align: center; font-size: 10px; overflow: hidden; white-space: nowrap; }
    .collage .delete { width: 22px; height: 22px; top: 2px; right: 2px; }
    .lightbox-delete { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); padding: 9px 20px; border: 1px solid #fff9ed80; border-radius: 99px; color: var(--paper); background: var(--ink); font-size: 15px; }

    .page-nav { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 28px; }
    .page-btn { width: 42px; height: 42px; border: 1.5px solid var(--ink); border-radius: 50%; background: var(--card); box-shadow: 3px 3px 0 var(--ink); font-size: 20px; transition: .18s; }
    .page-btn:hover:not(:disabled) { background: var(--yolk); transform: translateY(-2px); }
    .page-btn:disabled { opacity: .25; cursor: default; box-shadow: none; }
    .page-count { min-width: 90px; text-align: center; color: var(--muted); font-size: 13px; }

    .meals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 16px; align-items: start; }
    .meal-card { opacity: 0; animation: arrive .55s cubic-bezier(.2,.8,.2,1) forwards; }
    .meal-card:nth-child(4n+2) { transform: rotate(.7deg); }
    .meal-card:nth-child(4n+3) { transform: rotate(-.6deg); }
    .photo-wrap { position: relative; aspect-ratio: 1/1; overflow: hidden; border: 1.5px solid var(--ink); border-radius: 19px 15px 21px 14px; background: #efe6d6; box-shadow: 4px 5px 0 var(--ink); cursor: zoom-in; }
    .photo-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
    .photo-wrap.loading::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 25%, rgba(255,255,255,.65) 45%, transparent 65%); animation: photoShimmer 1.25s linear infinite; transform: translateX(-100%); }
    .meal-card:hover img { transform: scale(1.04) rotate(.5deg); }
    .delete { position: absolute; top: 8px; right: 8px; width: 27px; height: 27px; border: 0; border-radius: 50%; background: rgba(48,45,43,.8); color: white; opacity: 0; transition: .2s; }
    .meal-card:hover .delete { opacity: 1; }
    .caption { display: flex; justify-content: space-between; align-items: center; gap: 5px; padding: 9px 3px 0; }
    .caption strong { min-width: 0; overflow: hidden; font-size: 14px; font-weight: 500; white-space: nowrap; text-overflow: ellipsis; }
    .caption time { flex: none; color: var(--muted); font-size: 13px; }
    .meals.times-hidden .caption { display: none; }

    .empty { grid-column: 1/-1; min-height: 190px; display: grid; place-items: center; text-align: center; border: 1.5px dashed #cfc3b2; border-radius: 26px; color: var(--muted); }
    .empty b { display: block; color: var(--ink); margin-bottom: 5px; }
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; padding: 12px 18px; border-radius: 99px; color: #fff; background: var(--ink); font-size: 13px; transition: .3s; z-index: 10; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .lightbox { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 28px; background: rgba(35,31,28,.88); backdrop-filter: blur(12px); opacity: 0; visibility: hidden; transition: opacity .22s ease, visibility .22s ease; }
    .lightbox.open { opacity: 1; visibility: visible; }
    .lightbox-photo { display: block; max-width: min(92vw, 1100px); max-height: 86vh; object-fit: contain; border: 3px solid #fff9ed; border-radius: 22px; box-shadow: 0 25px 80px rgba(0,0,0,.45); transform: scale(.94); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
    .lightbox.open .lightbox-photo { transform: scale(1); }
    .lightbox-close { position: fixed; top: 20px; right: 20px; width: 46px; height: 46px; border: 2px solid #fff9ed; border-radius: 50%; color: #fff9ed; background: #302d2b; font-size: 28px; line-height: 1; box-shadow: 3px 3px 0 var(--berry); }
    body.photo-open { overflow: hidden; }
    .auth-modal { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; padding: 24px; background: rgba(48,45,43,.55); backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transition: .2s; }
    .auth-modal.open { opacity: 1; visibility: visible; }
    .auth-card { position: relative; width: min(420px, 100%); padding: 34px; border: 2px solid var(--ink); border-radius: 28px 34px 25px 31px; background: var(--paper); box-shadow: 9px 10px 0 var(--ink); transform: rotate(-.5deg); }
    .auth-card h2 { margin: 0 0 8px; font-family: "Long Cang", cursive; font-size: 40px; font-weight: 400; }
    .auth-card p { margin: 0 0 20px; color: var(--muted); font-size: 17px; line-height: 1.45; }
    .auth-card input[type="email"], .auth-card input[type="password"] { width: 100%; margin-bottom: 10px; padding: 13px 15px; border: 1.5px solid var(--ink); border-radius: 14px; background: #fff; font-size: 16px; }
    .auth-submit { width: 100%; margin-top: 12px; padding: 13px; border: 1.5px solid var(--ink); border-radius: 14px; color: #fff; background: var(--berry); font-weight: 700; box-shadow: 3px 4px 0 var(--ink); }
    .auth-close { position: absolute; top: 13px; right: 15px; border: 0; background: transparent; font-size: 25px; }
    .auth-status { min-height: 22px; margin: 14px 0 0 !important; color: var(--berry-dark) !important; }
    .signout-btn { width: 100%; margin-top: 8px; padding: 10px; border: 0; color: var(--muted); background: transparent; text-decoration: underline; }
    .remember-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px; color: var(--muted); font-size: 15px; }
    .remember-row input { width: 18px; height: 18px; accent-color: var(--berry); }
    .auth-mode { width: 100%; border: 0; color: var(--berry-dark); background: transparent; text-decoration: underline; text-underline-offset: 3px; }

    @keyframes arrive { from { transform: translateY(18px) rotate(-1deg); } to { opacity: 1; transform: none; } }
    @keyframes installPop { from { opacity: 0; transform: scale(.7) rotate(-5deg); } to { opacity: 1; transform: none; } }
    @keyframes photoShimmer { to { transform: translateX(100%); } }
    @keyframes cameraBusy { to { transform: scale(.82) rotate(-7deg); opacity: .55; } }
    @media (max-width: 760px) {
      .shell { width: min(100% - 26px, 600px); padding-top: 18px; }
      nav { margin-bottom: 42px; }
      .hero { margin-bottom: 38px; }
      h1 { font-size: clamp(54px, 18vw, 78px); }
      .upload-card { width: min(260px, 78%); min-height: 220px; justify-self: center; }
      .meals { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 13px; }
      .notebook { padding: 30px 20px 28px 40px; }
    }
    @media (max-width: 480px) {
      .date-pill { display: none; }
      .notebook { width: calc(100% + 8px); margin-left: -4px; padding: 25px 12px 24px 31px; border-radius: 9px 21px 21px 9px; }
      .notebook::before { left: 19px; }
      .rings { left: -8px; }
      .rings i { width: 25px; height: 9px; }
      .section-head { margin-bottom: 20px; }
      .section-head h2 { font-size: 22px; }
      .section-head p { font-size: 14px; }
      .page-tools { flex-direction: column; align-items: flex-end; gap: 5px; }
      .meals { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px 9px; }
      .photo-wrap { border-radius: 14px 11px 16px 10px; box-shadow: 3px 4px 0 var(--ink); }
      .delete { top: 5px; right: 5px; width: 24px; height: 24px; opacity: .82; }
      .caption { padding-top: 7px; }
      .caption strong { display: none; }
      .caption time { width: 100%; padding-right: 2px; text-align: right; font-size: 12px; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; }
      .stat { min-width: 0; }
    }

    /* Soft colored-pencil storybook direction */
    :root {
      --ink: #3d4c2d;
      --muted: #7f8a70;
      --paper: #f7f7df;
      --card: #fffdf0;
      --berry: #f1a6a0;
      --berry-dark: #bc6e69;
      --matcha: #a9d96b;
      --yolk: #f5d66f;
      --line: #dce1c2;
      --shadow: 0 18px 46px rgba(81, 103, 58, .12);
    }
    body {
      background:
        radial-gradient(circle at 5% 10%, #dff0b9 0 7%, transparent 20%),
        radial-gradient(circle at 96% 23%, #dbeeb4 0 8%, transparent 25%),
        linear-gradient(180deg, #f4f8df 0%, #eef5d8 46%, #e1efd0 100%);
      background-attachment: fixed;
    }
    body::before { opacity: .8; mix-blend-mode: multiply; }
    .shell { max-width: 940px; padding-top: 22px; }
    nav { margin-bottom: 34px; }
    .brand { color: #477235; font-family: "Patrick Hand", "Long Cang", cursive; font-size: 30px; }
    .brand-mark { width: 36px; height: 36px; border: 0; color: #fffbed; background: #91c95e; box-shadow: none; }
    .date-pill, .lang-btn, .account-btn, .install-btn { border-color: #698855; box-shadow: none; }

            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
            canvas.getContext('2d', { alpha: false }).drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', .72));
          } catch (error) { reject(error); }
        };
        img.onerror = () => reject(new Error('Thumbnail creation failed'));
        img.src = dataUrl;
      });
    }

    const thumbnailPath = path => {
      const parts = path.split('/'), file = parts.pop();
      return `${parts[0]}/thumbs/${file}`;
    };
    const blobToDataUrl = blob => new Promise((resolve, reject) => {
      const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(blob);
    });

    async function uploadCloudEntry(dataUrl, meta) {
      if (!currentUser) throw new Error('Login required');
      const id = crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const path = `${currentUser.id}/${id}.jpg`;
      const thumbPath = thumbnailPath(path);
      const blob = await fetch(dataUrl).then(response => response.blob());
      const { error: uploadError } = await cloud.storage.from('journal-photos').upload(path, blob, {
        contentType: 'image/jpeg', cacheControl: '3600', upsert: false
      });
      if (uploadError) throw uploadError;
      const thumbnail = await makeThumbnail(dataUrl);
      const thumbBlob = await fetch(thumbnail).then(response => response.blob());
      const { error: thumbError } = await cloud.storage.from('journal-photos').upload(thumbPath, thumbBlob, {
        contentType: 'image/jpeg', cacheControl: '86400', upsert: false
      });
      if (thumbError) console.warn('Thumbnail upload failed:', thumbError);
      const { data: row, error: rowError } = await cloud.from('journal_entries').insert({
        user_id: currentUser.id,
        storage_path: path,
        entry_date: meta.date,
        entry_time: meta.time,
        moment_type: meta.mealType
      }).select().single();
      if (rowError) {
        await cloud.storage.from('journal-photos').remove([path]);
        throw rowError;
      }
      await cacheThumbnail(path, thumbnail);
      await cacheFullPhoto(path, dataUrl);
      return { id: row.id, data: dataUrl, thumbnail, date: row.entry_date, time: row.entry_time, mealType: row.moment_type, storagePath: path };
    }

    async function loadCloudEntries() {
      if (!currentUser) return;
      const { data: rows, error } = await cloud.from('journal_entries').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      entries = rows.map(row => ({ id: row.id, data: '', thumbnail: '', date: row.entry_date, time: row.entry_time, mealType: row.moment_type, storagePath: row.storage_path }));
      pageIndex = 0; render();
      hydrateThumbnails(entries);
    }

    async function fetchPrivatePhoto(path) {
      const { data, error } = await cloud.storage.from('journal-photos').createSignedUrl(path, 3600);
      if (error) throw error;
      const response = await fetch(data.signedUrl);
      if (!response.ok) throw new Error(`Photo download failed: ${response.status}`);
      return response.blob();
    }

    async function hydrateThumbnail(entry) {
      let thumbnail = await getCachedThumbnail(entry.storagePath);
      if (!thumbnail) {
        try { thumbnail = await blobToDataUrl(await fetchPrivatePhoto(thumbnailPath(entry.storagePath))); }
        catch {
          let fullData = await getCachedFullPhoto(entry.storagePath);
          if (!fullData) {
            fullData = await blobToDataUrl(await fetchPrivatePhoto(entry.storagePath));
            await cacheFullPhoto(entry.storagePath, fullData);
          }
          thumbnail = await makeThumbnail(fullData);
          const blob = await fetch(thumbnail).then(response => response.blob());
          await cloud.storage.from('journal-photos').upload(thumbnailPath(entry.storagePath), blob, { contentType:'image/jpeg', cacheControl:'86400', upsert:false });
        }
        await cacheThumbnail(entry.storagePath, thumbnail);
      }
      entry.thumbnail = thumbnail;
      const wrap = document.querySelector(`.photo-wrap[data-entry-id="${entry.id}"]`);
      if (wrap) { const img = wrap.querySelector('img'); img.src = thumbnail; wrap.classList.remove('loading'); }
    }

    async function hydrateThumbnails(items) {
      let cursor = 0;
      const worker = async () => {
        while (cursor < items.length) {
          const entry = items[cursor++];
          try { await hydrateThumbnail(entry); } catch (error) { console.warn('Thumbnail load failed:', error); }
        }
      };
      await Promise.all(Array.from({ length: Math.min(3, items.length) }, worker));
    }

    async function migrateLocalEntries() {
      if (!currentUser || !localEntries.length) return;
      $('#authStatus').textContent = language === 'zh' ? `正在迁移 ${localEntries.length} 张旧照片…` : `Moving ${localEntries.length} local photos…`;
      const remaining = [];
      for (const entry of localEntries) {
        try { await uploadCloudEntry(entry.data, { date: entry.date || todayKey, time: entry.time, mealType: entry.mealType ?? 1 }); }
        catch (error) { console.warn('Local photo migration failed:', error); remaining.push(entry); }
      }
      localEntries = remaining;
      await saveLocalEntries(remaining);
      $('#authStatus').textContent = remaining.length
        ? (language === 'zh' ? `${remaining.length} 张旧照片迁移失败，请稍后重新登录重试。` : `${remaining.length} photos could not be moved. Try again later.`)
        : (language === 'zh' ? '旧照片已安全迁移到云端。' : 'Local photos are now safely in the cloud.');
    }

    function openDiaryDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('little-keeps-diary', 2);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains('journal')) request.result.createObjectStore('journal');
          if (!request.result.objectStoreNames.contains('photos')) request.result.createObjectStore('photos');
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function getCachedThumbnail(path) {
      const db = await openDiaryDb();
      const value = await new Promise((resolve, reject) => {
        const request = db.transaction('photos').objectStore('photos').get(path);
        request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error);
      });
      db.close(); return value;
    }

    async function cacheThumbnail(path, data) {
      const db = await openDiaryDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction('photos', 'readwrite'); tx.objectStore('photos').put(data, path);
        tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
      });
      db.close();
    }

    async function getCachedFullPhoto(path) {
      const db = await openDiaryDb();
      const value = await new Promise((resolve, reject) => {
        const request = db.transaction('photos').objectStore('photos').get(`full:${path}`);
        request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error);
      });
      db.close(); return value;
    }

    async function cacheFullPhoto(path, data) {
      const db = await openDiaryDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction('photos', 'readwrite'); tx.objectStore('photos').put(data, `full:${path}`);
        tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
      });
      db.close();
    }

    async function removeCachedThumbnail(path) {
      const db = await openDiaryDb();
      await new Promise(resolve => {
        const tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').delete(path); tx.objectStore('photos').delete(`full:${path}`); tx.oncomplete = resolve;
      });
      db.close();
    }

    async function saveLocalEntries(values) {
      const db = await openDiaryDb();
      await new Promise((resolve, reject) => {
        const transaction = db.transaction('journal', 'readwrite');
        transaction.objectStore('journal').put(values.slice(0, 100), 'entries');
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
      db.close();
      localStorage.removeItem(STORAGE_KEY);
    }

    async function loadSavedEntries() {
      try {
        const db = await openDiaryDb();
        const saved = await new Promise((resolve, reject) => {
          const request = db.transaction('journal').objectStore('journal').get('entries');
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        db.close();
        if (saved?.length) entries = saved;
        else if (entries.length) await saveLocalEntries(entries);
        localEntries = [...entries];
        render();
      } catch (error) { console.warn('Diary storage unavailable:', error); }
    }

    async function initCloud() {
      const { data: { session } } = await cloud.auth.getSession();

    function periodKey(key) {
      if (diaryView === 'month') return key.slice(0, 7) + '-01';
      if (diaryView === 'week') {
        const date = new Date(key + 'T12:00:00');
        date.setDate(date.getDate() - (date.getDay() + 6) % 7);
        return iso(date);
      }
      return key;
    }
    function getPages() { return [...new Set([todayKey, ...(selectedCalendarDate ? [selectedCalendarDate] : []), ...entries.map(e => e.date)].map(periodKey))].sort().reverse(); }
    function periodDates(key) {
      const start = new Date(key + 'T12:00:00');
      const count = diaryView === 'week' ? 7 : diaryView === 'month' ? new Date(start.getFullYear(), start.getMonth() + 1, 0).getDate() : 1;
      return Array.from({length: count}, (_, i) => { const date = new Date(start); date.setDate(date.getDate() + i); return iso(date); });
    }

    }

    function layoutCollage() {
      const board = $('#meals');
      if (!board.classList.contains('collage')) return;
      const cards = [...board.querySelectorAll('.meal-card')], count = cards.length;
      const width = board.clientWidth, height = board.clientHeight;
      const columns = Math.max(1, Math.ceil(Math.sqrt(count * width / height * 1.18)));
      const rows = Math.ceil(count / columns), cellW = width / columns, cellH = height / rows;
      const positions = readCollagePositions();
      const slots = Array.from({length:count}, (_, i) => i);
      let shuffle = scatterSeed;
      for (let i = count - 1; i > 0; i--) {
        shuffle = (Math.imul(shuffle, 1664525) + 1013904223) >>> 0;
        const j = shuffle % (i + 1); [slots[i], slots[j]] = [slots[j], slots[i]];
      }
      cards.forEach((card, i) => {
        const id = card.querySelector('.photo-wrap').dataset.entryId;
        let seed = [...id].reduce((n, ch) => (n * 31 + ch.charCodeAt(0)) >>> 0, scatterSeed);
        const random = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
        const w = Math.min(cellW * .64, cellH * .56, width * .4) * (.92 + random() * .08);
        const h = w * 1.18;
        let x = (slots[i] % columns + .5 + (random() - .5) * .24) * cellW;
        let y = (Math.floor(slots[i] / columns) + .5 + (random() - .5) * .24) * cellH;
        card.style.setProperty('--tilt', `${(random() - .5) * 24}deg`);
        const saved = positions[id];
        if (saved) { x = Math.max(w * .6, Math.min(width - w * .6, saved.x * width)); y = Math.max(h * .6, Math.min(height - h * .6, saved.y * height)); }
        Object.assign(card.style, {left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`});
      });
    }
    let scatterSeed = 42;
    function collagePositionKey() { return `memorable-layout-v2:${currentUser?.id || 'local'}:${diaryView}:${getPages()[pageIndex]}`; }
    function readCollagePositions() {
      try { return JSON.parse(localStorage.getItem(collagePositionKey()) || '{}'); } catch { return {}; }
    }
    function enableCollageDragging() {
      const board = $('#meals');
      if (!board.classList.contains('collage')) return;
      board.querySelectorAll('.meal-card').forEach(card => {
        let drag = null;
        card.onpointerdown = event => {
          if (!event.isPrimary || event.button !== 0) return;
          drag = {id:event.pointerId, startX:event.clientX, startY:event.clientY, x:parseFloat(card.style.left), y:parseFloat(card.style.top), moved:false};
          card.setPointerCapture(event.pointerId);
        };
        card.onpointermove = event => {
          if (!drag || drag.id !== event.pointerId) return;
          const dx = event.clientX - drag.startX, dy = event.clientY - drag.startY;
          if (!drag.moved && Math.hypot(dx, dy) < 7) return;
          drag.moved = true; card.classList.add('dragging');
          const marginX = card.offsetWidth * .6, marginY = card.offsetHeight * .6;
          card.style.left = `${Math.max(marginX, Math.min(board.clientWidth - marginX, drag.x + dx))}px`;
          card.style.top = `${Math.max(marginY, Math.min(board.clientHeight - marginY, drag.y + dy))}px`;
        };
        const finish = event => {
          if (!drag || drag.id !== event.pointerId) return;
          if (drag.moved) {
            card.dataset.suppressClickUntil = String(Date.now() + 500);
            const positions = readCollagePositions();
            positions[card.querySelector('.photo-wrap').dataset.entryId] = {x:parseFloat(card.style.left)/board.clientWidth, y:parseFloat(card.style.top)/board.clientHeight};
            try { localStorage.setItem(collagePositionKey(), JSON.stringify(positions)); } catch (error) { console.warn('Layout could not be saved', error); }
          } else if (event.type === 'pointerup') { card.querySelector('.photo-wrap').click(); card.dataset.suppressClickUntil = String(Date.now() + 500); }
          card.classList.remove('dragging');
          if (card.hasPointerCapture(event.pointerId)) card.releasePointerCapture(event.pointerId);
          drag = null;
        };
        card.onpointerup = finish; card.onpointercancel = finish; card.onlostpointercapture = finish;
      });
    }
    if (window.ResizeObserver) new ResizeObserver(layoutCollage).observe($('#meals'));
    else window.addEventListener('resize', layoutCollage);

    function fitDateTitle() {
      const title = $('#pageDate');
      title.style.fontSize = '';
      const size = parseFloat(getComputedStyle(title).fontSize);
      if (title.scrollWidth > title.clientWidth && title.clientWidth > 0) title.style.fontSize = `${size * title.clientWidth / title.scrollWidth}px`;
    }
    window.addEventListener('resize', fitDateTitle);
    document.fonts.ready.then(fitDateTitle);
    let motionEnabled = false, lastAcceleration = null, lastMotionTime = 0, shakeTimer;
    function settlePhotos() {
      $('#meals').querySelectorAll('.meal-card').forEach(card => { card.getAnimations().forEach(animation => animation.cancel()); });
      if (!$('#meals').classList.contains('collage')) return;
      scatterSeed = Math.floor(Math.random() * 1000000);
      try { localStorage.removeItem(collagePositionKey()); } catch {}
      const cards = [...$('#meals').querySelectorAll('.meal-card')];
      const before = cards.map(card => ({left:card.style.left, top:card.style.top}));
      layoutCollage();
      const positions = {};
      cards.forEach((card, i) => {
        card.animate([before[i], {left:card.style.left, top:card.style.top}], {duration:700, easing:'cubic-bezier(.2,.8,.2,1)'});
        positions[card.querySelector('.photo-wrap').dataset.entryId] = {x:parseFloat(card.style.left)/$('#meals').clientWidth, y:parseFloat(card.style.top)/$('#meals').clientHeight};
      });
      try { localStorage.setItem(collagePositionKey(), JSON.stringify(positions)); } catch {}
    }
    function handleMotion(event) {
      if (document.hidden || !$('#meals').classList.contains('collage') || $('#meals .dragging') || $('#lightbox').classList.contains('open')) return;
      const a = event.accelerationIncludingGravity;
      if (!a || ![a.x, a.y, a.z].every(Number.isFinite)) return;
      const now = Date.now(), previous = lastAcceleration;
      lastAcceleration = {x:a.x, y:a.y, z:a.z};
      if (!previous || now - lastMotionTime < 100 || Math.hypot(a.x-previous.x, a.y-previous.y, a.z-previous.z) < 9) return;
      lastMotionTime = now;
      $('#meals').querySelectorAll('.meal-card').forEach((card, i) => {
        card.getAnimations().forEach(animation => animation.cancel());
        const tilt = parseFloat(card.style.getPropertyValue('--tilt')) || 0;
        const board = $('#meals'), gain = .6 + Math.random() * .8;
        const margin = card.offsetWidth * .75;
        const x = parseFloat(card.style.left), y = parseFloat(card.style.top);
        const dx = Math.max(margin-x, Math.min(board.clientWidth-margin-x, (a.x-previous.x) * 7 * gain));
        const dy = Math.max(card.offsetHeight*.65-y, Math.min(board.clientHeight-card.offsetHeight*.65-y, (a.y-previous.y) * 7 * gain));
        card.animate([
          {transform:`translate(-50%, -50%) rotate(${tilt}deg)`},
          {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${tilt + (i % 2 ? 25 : -25)}deg)`},
          {transform:`translate(-50%, -50%) rotate(${tilt}deg)`}
        ], {duration:350, easing:'ease-in-out'});
      });
      clearTimeout(shakeTimer);
      shakeTimer = setTimeout(settlePhotos, 650);
    }
    function startMotion() {
      if (motionEnabled) return;
      motionEnabled = true;
      window.addEventListener('devicemotion', handleMotion, {passive:true});
    }
    document.addEventListener('click', async event => {
      if (!event.target.closest('[data-view="week"], [data-view="month"]')) return;
      try {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          if (await DeviceMotionEvent.requestPermission() !== 'granted') return;
        }
        startMotion();
      } catch (error) { console.warn('Motion permission unavailable', error); }
    });
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') startMotion();

    function showToast() {
      $('#toast').classList.add('show');
      setTimeout(() => $('#toast').classList.remove('show'), 1900);
    }
    let installPrompt;
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault(); installPrompt = event; $('#installBtn').classList.add('ready');
    });
    $('#installBtn').onclick = async () => {
      if (!installPrompt) return;
      installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; $('#installBtn').classList.remove('ready');
    };
    window.addEventListener('appinstalled', () => $('#installBtn').classList.remove('ready'));
    function closePhoto() {
      $('#lightbox').classList.remove('open'); document.body.classList.remove('photo-open');
      setTimeout(() => { if (!$('#lightbox').classList.contains('open')) $('#lightboxPhoto').removeAttribute('src'); }, 230);
    }
    $('#lightboxClose').onclick = closePhoto;
    $('#lightbox').onclick = event => { if (event.target === $('#lightbox')) closePhoto(); };
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { closePhoto(); closeCameraMenu(); $('#calendarClose').click(); } });
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
    render();
    (async () => { await loadSavedEntries(); await initCloud(); })();
  </script>
</body>
</html>
