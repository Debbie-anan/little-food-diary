<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff9ed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小小值得" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>小小值得 · 生活照片手账</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Long+Cang&family=Ma+Shan+Zheng&family=Patrick+Hand&display=swap');

    :root {
      --ink: #302d2b;
      --muted: #8e877f;
      --paper: #fff9ed;
      --card: #fffdf8;
      --berry: #ff6d76;
      --berry-dark: #e95560;
      --matcha: #8abf79;
      --yolk: #ffc95a;
      --line: #e9dfce;
      --shadow: 0 16px 45px rgba(90, 72, 49, .11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Patrick Hand", "Long Cang", cursive;
      background:
        radial-gradient(circle at 7% 8%, rgba(255, 201, 90, .22) 0 75px, transparent 76px),
        radial-gradient(circle at 93% 30%, rgba(138, 191, 121, .16) 0 115px, transparent 116px),
        var(--paper);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E");
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .shell { width: min(1120px, calc(100% - 34px)); margin: 0 auto; padding: 28px 0 96px; }

    nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 56px; }
    .brand { display: flex; align-items: center; gap: 12px; font-family: "Long Cang", "Patrick Hand", cursive; font-size: 27px; letter-spacing: .04em; transform: rotate(-1deg); }
    .brand-mark {
      width: 42px; height: 42px; display: grid; place-items: center;
      border: 2px solid var(--ink); border-radius: 50% 48% 46% 52%;
      background: var(--yolk); box-shadow: 3px 3px 0 var(--ink); transform: rotate(-5deg);
    }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .date-pill, .lang-btn { color: var(--muted); font-size: 16px; padding: 8px 14px; border: 1.5px solid var(--ink); border-radius: 48% 52% 45% 55%; background: rgba(255,255,255,.65); }
    .lang-btn { color: var(--ink); font-weight: 800; transition: .2s; }
    .lang-btn:hover { background: var(--yolk); transform: rotate(-2deg); }
    .install-btn { display: none; align-items: center; gap: 6px; padding: 9px 14px; border: 1.5px solid var(--ink); border-radius: 99px; color: #fff; background: var(--ink); font-weight: 800; font-size: 13px; box-shadow: 2px 3px 0 var(--berry); }
    .install-btn.ready { display: inline-flex; animation: installPop .45s cubic-bezier(.2,.9,.3,1.3); }
    .account-btn { padding: 9px 14px; border: 1.5px solid var(--ink); border-radius: 99px; color: var(--ink); background: var(--yolk); font-weight: 700; font-size: 14px; box-shadow: 2px 3px 0 var(--ink); }
    .account-btn.signed-in { background: var(--matcha); }

    .hero { display: grid; grid-template-columns: 1.12fr .88fr; align-items: center; gap: 72px; margin-bottom: 74px; }
    .eyebrow { color: var(--berry-dark); font-weight: 700; font-size: 15px; letter-spacing: .13em; text-transform: uppercase; transform: rotate(-1deg); transform-origin: left; }
    h1 { margin: 10px 0 18px; font-family: "Long Cang", "Patrick Hand", cursive; font-size: clamp(64px, 8vw, 105px); line-height: .92; letter-spacing: .01em; font-weight: 400; transform: rotate(-.6deg); transform-origin: left; }
    h1 span { position: relative; color: var(--berry); font-family: "Long Cang", "Patrick Hand", cursive; font-weight: 400; letter-spacing: .02em; }
    h1 span::after { content: ""; position: absolute; height: 8px; left: 4%; right: -2%; bottom: -2px; border-radius: 50%; background: var(--yolk); z-index: -1; transform: rotate(-2deg); }
    .intro { max-width: 520px; font-size: 21px; line-height: 1.55; color: #69615a; }

    .stats { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
    .stat { min-width: 120px; padding: 14px 17px; border: 1px solid var(--line); background: rgba(255,255,255,.5); border-radius: 18px; }
    .stat strong { display: block; font-size: 23px; letter-spacing: -.04em; }
    .stat span { color: var(--muted); font-size: 15px; }

    .upload-card {
      position: relative; overflow: hidden; min-height: 372px; padding: 24px;
      display: flex; flex-direction: column; justify-content: flex-end;
      border: 2px solid var(--ink); border-radius: 38px 32px 40px 28px;
      background: var(--matcha); box-shadow: 10px 12px 0 var(--ink);
      transform: rotate(1.4deg); transition: transform .25s ease;
    }
    .upload-card:hover { transform: rotate(0deg) translateY(-3px); }
    .doodle { position: absolute; font-family: "Long Cang", "Patrick Hand", cursive; color: rgba(48,45,43,.78); }
    .doodle.one { top: 24px; left: 26px; font-size: 28px; transform: rotate(-8deg); }
    .doodle.two { right: 28px; top: 35px; font-size: 50px; transform: rotate(12deg); }
    .plate { position: absolute; width: 180px; height: 180px; left: 50%; top: 46%; transform: translate(-50%,-50%); border: 18px solid #f8f0df; border-radius: 50%; background: #fffaf0; box-shadow: 0 8px 0 rgba(48,45,43,.13); }
    .plate::before { content: "📷"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 68px; transform: rotate(-8deg); filter: saturate(.85); }
    .upload-btn { position: relative; z-index: 2; border: 2px solid var(--ink); border-radius: 18px; padding: 17px 20px; color: #fff; background: var(--ink); font-weight: 900; box-shadow: 0 5px 0 rgba(255,255,255,.4); transition: .2s ease; }
    .upload-btn:hover { background: var(--berry); transform: translateY(-2px); }
    .upload-btn:disabled { cursor: wait; opacity: .72; transform: none; }
    #fileInput { display: none; }

    .notebook { position: relative; padding: 34px 34px 30px 52px; border: 1px solid #dfd2bf; border-radius: 12px 26px 26px 12px; background: repeating-linear-gradient(to bottom, #fffdf8 0, #fffdf8 37px, #eadfcd 38px); box-shadow: 10px 12px 0 #dfcdb5, var(--shadow); min-height: 360px; }
    .notebook::before { content: ""; position: absolute; left: 23px; top: 0; bottom: 0; width: 2px; background: rgba(255,109,118,.28); }
    .rings { position: absolute; left: -10px; top: 34px; bottom: 34px; display: flex; flex-direction: column; justify-content: space-around; }
    .rings i { display: block; width: 31px; height: 10px; border: 3px solid var(--ink); border-radius: 99px; background: #f4e7d1; box-shadow: 2px 2px 0 rgba(48,45,43,.18); }
    .page-corner { position: absolute; right: 0; bottom: 0; width: 54px; height: 54px; border-radius: 28px 0 24px 0; background: linear-gradient(135deg, #efe1cb 50%, transparent 51%); opacity: .75; }
    .section-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 27px; }
    .section-head h2 { margin: 0; font-family: "Long Cang", "Patrick Hand", cursive; font-size: 36px; font-weight: 400; letter-spacing: .01em; transform: rotate(-.5deg); transform-origin: left; }
    .section-head p { margin: 3px 0 0; color: var(--muted); font-size: 17px; }
    .clear-btn { border: 0; background: transparent; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 4px; }

    .page-nav { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 28px; }
    .page-btn { width: 42px; height: 42px; border: 1.5px solid var(--ink); border-radius: 50%; background: var(--card); box-shadow: 3px 3px 0 var(--ink); font-size: 20px; transition: .18s; }
    .page-btn:hover:not(:disabled) { background: var(--yolk); transform: translateY(-2px); }
    .page-btn:disabled { opacity: .25; cursor: default; box-shadow: none; }
    .page-count { min-width: 90px; text-align: center; color: var(--muted); font-size: 13px; }

    .meals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .meal-card { opacity: 0; animation: arrive .55s cubic-bezier(.2,.8,.2,1) forwards; }
    .photo-wrap { position: relative; aspect-ratio: 4/3; overflow: hidden; border: 1.5px solid var(--ink); border-radius: 24px 20px 28px 18px; background: #efe6d6; box-shadow: 5px 6px 0 var(--ink); cursor: zoom-in; }
    .photo-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
    .meal-card:hover img { transform: scale(1.04) rotate(.5deg); }
    .tag { position: absolute; top: 13px; left: 13px; padding: 6px 10px; border-radius: 99px; background: var(--card); font-size: 11px; font-weight: 900; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .delete { position: absolute; top: 11px; right: 11px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: rgba(48,45,43,.8); color: white; opacity: 0; transition: .2s; }
    .meal-card:hover .delete { opacity: 1; }
    .caption { display: flex; justify-content: space-between; align-items: center; padding: 13px 5px 0; }
    .caption strong { font-size: 18px; font-weight: 500; }
    .caption time { color: var(--muted); font-size: 15px; }

    .empty { grid-column: 1/-1; min-height: 190px; display: grid; place-items: center; text-align: center; border: 1.5px dashed #cfc3b2; border-radius: 26px; color: var(--muted); }
    .empty b { display: block; color: var(--ink); margin-bottom: 5px; }
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; padding: 12px 18px; border-radius: 99px; color: #fff; background: var(--ink); font-size: 13px; transition: .3s; z-index: 10; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .lightbox { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 28px; background: rgba(35,31,28,.88); backdrop-filter: blur(12px); opacity: 0; visibility: hidden; transition: opacity .22s ease, visibility .22s ease; }
    .lightbox.open { opacity: 1; visibility: visible; }
    .lightbox-photo { display: block; max-width: min(92vw, 1100px); max-height: 86vh; object-fit: contain; border: 3px solid #fff9ed; border-radius: 22px; box-shadow: 0 25px 80px rgba(0,0,0,.45); transform: scale(.94); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
    .lightbox.open .lightbox-photo { transform: scale(1); }
    .lightbox-close { position: fixed; top: 20px; right: 20px; width: 46px; height: 46px; border: 2px solid #fff9ed; border-radius: 50%; color: #fff9ed; background: #302d2b; font-size: 28px; line-height: 1; box-shadow: 3px 3px 0 var(--berry); }
    body.photo-open { overflow: hidden; }
    .auth-modal { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; padding: 24px; background: rgba(48,45,43,.55); backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transition: .2s; }
    .auth-modal.open { opacity: 1; visibility: visible; }
    .auth-card { position: relative; width: min(420px, 100%); padding: 34px; border: 2px solid var(--ink); border-radius: 28px 34px 25px 31px; background: var(--paper); box-shadow: 9px 10px 0 var(--ink); transform: rotate(-.5deg); }
    .auth-card h2 { margin: 0 0 8px; font-family: "Long Cang", cursive; font-size: 40px; font-weight: 400; }
    .auth-card p { margin: 0 0 20px; color: var(--muted); font-size: 17px; line-height: 1.45; }
    .auth-card input[type="email"], .auth-card input[type="password"] { width: 100%; margin-bottom: 10px; padding: 13px 15px; border: 1.5px solid var(--ink); border-radius: 14px; background: #fff; font-size: 16px; }
    .auth-submit { width: 100%; margin-top: 12px; padding: 13px; border: 1.5px solid var(--ink); border-radius: 14px; color: #fff; background: var(--berry); font-weight: 700; box-shadow: 3px 4px 0 var(--ink); }
    .auth-close { position: absolute; top: 13px; right: 15px; border: 0; background: transparent; font-size: 25px; }
    .auth-status { min-height: 22px; margin: 14px 0 0 !important; color: var(--berry-dark) !important; }
    .signout-btn { width: 100%; margin-top: 8px; padding: 10px; border: 0; color: var(--muted); background: transparent; text-decoration: underline; }
    .remember-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px; color: var(--muted); font-size: 15px; }
    .remember-row input { width: 18px; height: 18px; accent-color: var(--berry); }
    .auth-mode { width: 100%; border: 0; color: var(--berry-dark); background: transparent; text-decoration: underline; text-underline-offset: 3px; }

    @keyframes arrive { from { transform: translateY(18px) rotate(-1deg); } to { opacity: 1; transform: none; } }
    @keyframes installPop { from { opacity: 0; transform: scale(.7) rotate(-5deg); } to { opacity: 1; transform: none; } }
    @media (max-width: 760px) {
      .shell { width: min(100% - 26px, 600px); padding-top: 18px; }
      nav { margin-bottom: 42px; }
      .hero { grid-template-columns: 1fr; gap: 42px; margin-bottom: 58px; }
      h1 { font-size: clamp(54px, 18vw, 78px); }
      .upload-card { min-height: 330px; }
      .meals { grid-template-columns: 1fr 1fr; }
      .notebook { padding: 30px 20px 28px 40px; }
    }
    @media (max-width: 480px) {
      .date-pill { display: none; }
      .meals { grid-template-columns: 1fr; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; }
      .stat { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav>
      <div class="brand"><div class="brand-mark">✿</div><span>小小值得</span></div>
      <div class="nav-actions"><div class="date-pill" id="today"></div><button class="install-btn" id="installBtn">⇩ <span>安装 App</span></button><button class="account-btn" id="accountBtn">云端登录</button><button class="lang-btn" id="langBtn">EN</button></div>
    </nav>

    <section class="hero">
      <div>
        <div class="eyebrow" id="eyebrow">MY LITTLE LIFE NOTES</div>
        <h1 id="heroTitle">把今天的<br><span>小小值得</span>留下</h1>
        <p class="intro" id="intro">一顿好吃的、一朵奇怪的云、路上遇见的小狗……把让你笑了一下的瞬间，都收进这本生活手账。</p>
        <div class="stats">
          <div class="stat"><strong id="todayCount">0</strong><span id="todayLabel">今日记录</span></div>
          <div class="stat"><strong id="totalCount">0</strong><span id="totalLabel">累计美味</span></div>
        </div>
      </div>

      <div class="upload-card">
        <div class="doodle one" id="doodleText">今天，什么值得记住？</div><div class="doodle two">✦</div>
        <div class="plate"></div>
        <button class="upload-btn" id="uploadBtn">收藏这个瞬间 · 上传照片</button>
        <input id="fileInput" type="file" accept="image/*" multiple />
      </div>
    </section>

    <section class="notebook">
      <div class="rings"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="page-corner"></div>
      <div class="section-head">
        <div><h2 id="pageDate"></h2><p id="pageSubtitle">今天有什么，让你想多看一眼？</p></div>
        <button class="clear-btn" id="clearBtn">清空记录</button>
      </div>
      <div class="meals" id="meals"></div>
      <div class="page-nav"><button class="page-btn" id="prevPage" aria-label="Previous page">‹</button><span class="page-count" id="pageCount"></span><button class="page-btn" id="nextPage" aria-label="Next page">›</button></div>
    </section>
  </main>
  <div class="toast" id="toast">又收集到一份美味 ✦</div>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo preview">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
    <img class="lightbox-photo" id="lightboxPhoto" alt="放大的生活手账照片" />
  </div>

  <div class="auth-modal" id="authModal" role="dialog" aria-modal="true">
    <div class="auth-card">
      <button class="auth-close" id="authClose" aria-label="Close">×</button>
      <h2 id="authTitle">登录你的云端手账</h2>
      <p id="authIntro">使用邮箱和密码登录，照片只对你可见。</p>
      <form id="authForm">
        <input id="emailInput" type="email" autocomplete="email" placeholder="你的邮箱" required />
        <input id="passwordInput" type="password" autocomplete="current-password" minlength="6" placeholder="密码（至少 6 位）" required />
        <label class="remember-row"><input id="rememberLogin" type="checkbox" checked /> <span id="rememberLabel">记住登录状态</span></label>
        <button class="auth-submit" id="authSubmit" type="submit">登录</button>
        <button class="auth-mode" id="authMode" type="button">第一次使用？创建账号</button>
        <button class="auth-mode" id="recoverMode" type="button">已有邮箱账号？设置或忘记密码</button>
      </form>
      <p class="auth-status" id="authStatus"></p>
      <button class="signout-btn" id="signoutBtn" hidden>退出登录</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const STORAGE_KEY = 'little-food-diary-v1';
    const SUPABASE_URL = 'https://psizjjyvexytaaaetsne.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Xaxr8xSsBh44pd8CJDBDSw_kh92RR9I';
    const authStorage = {
      getItem: key => (localStorage.getItem('remember-cloud-login') !== 'false' ? localStorage : sessionStorage).getItem(key),
      setItem: (key, value) => (localStorage.getItem('remember-cloud-login') !== 'false' ? localStorage : sessionStorage).setItem(key, value),
      removeItem: key => { localStorage.removeItem(key); sessionStorage.removeItem(key); }
    };
    const cloud = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: authStorage, persistSession: true, autoRefreshToken: true } });
    const $ = (s) => document.querySelector(s);
    const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const todayKey = iso(new Date());
    let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let localEntries = [];
    let currentUser = null;
    let language = localStorage.getItem('food-diary-language') || 'zh';
    let pageIndex = 0;

    const copy = {
      zh: { brand:'小小值得', title:'把今天的<br><span>小小值得</span>留下', intro:'一顿好吃的、一朵奇怪的云、路上遇见的小狗……把让你笑了一下的瞬间，都收进这本生活手账。', today:'今日收藏', total:'全部瞬间', doodle:'今天，什么值得记住？', upload:'收藏这个瞬间 · 上传照片', uploading:'正在保存到云端…', install:'安装 App', login:'云端登录', loggedIn:'云端已连接', subtitle:'今天有什么，让你想多看一眼？', clear:'清空记录', emptyTitle:'这一页还在等故事', emptyBody:'上传一张值得记住的照片吧 ✿', caption:'今天的小小值得 ♡', page:'第 {n} / {all} 页', toast:'已安全保存到云端 ✦', uploadError:'这张照片读取或上传失败，请稍后重试。', storageError:'照片没能保存到云端，请检查网络后重试。', confirm:'要删除云端的全部生活记录吗？', meals:['清晨发现','午间一刻','下午偶遇','夜晚收藏'] },
      en: { brand:'Little Keeps', title:'Keep the little things<br><span>worth remembering</span>', intro:'A lovely meal, a strange little cloud, a dog you met on the way… Keep every moment that made you smile in this tiny life journal.', today:"Today's keeps", total:'All moments', doodle:"What felt worth remembering?", upload:'Keep this moment · Upload photo', uploading:'Saving to cloud…', install:'Install App', login:'Cloud login', loggedIn:'Cloud connected', subtitle:'What made you stop and look today?', clear:'Clear all', emptyTitle:'This page is waiting for a story', emptyBody:'Add a moment worth remembering ✿', caption:'A little thing worth keeping ♡', page:'Page {n} / {all}', toast:'Safely saved to your cloud ✦', uploadError:'This photo could not be read or uploaded. Please try again.', storageError:'The photo could not be saved to the cloud. Check your connection.', confirm:'Delete your entire cloud journal?', meals:['Morning find','Midday moment','Afternoon sighting','Evening keep'] }
    };

    // Upgrade entries saved by the earlier single-day version.
    entries = entries.map(e => ({...e, date: /^\d{4}-\d{2}-\d{2}$/.test(e.date) ? e.date : todayKey}));
    $('#langBtn').onclick = () => { language = language === 'zh' ? 'en' : 'zh'; localStorage.setItem('food-diary-language', language); render(); };
    $('#uploadBtn').onclick = () => currentUser ? $('#fileInput').click() : openAuth();
    $('#fileInput').onchange = async (event) => {
      const files = [...event.target.files].filter(file => file.type.startsWith('image/') || /\.(heic|heif|jpg|jpeg|png|webp)$/i.test(file.name));
      if (!files.length) return;
      const button = $('#uploadBtn');
      button.disabled = true; button.textContent = copy[language].uploading;
      let added = 0;
      for (const file of files) {
        try {
          const data = await compressImage(file);
          const entry = await uploadCloudEntry(data, {
            date: todayKey,
            time: new Date().toLocaleTimeString(language === 'zh' ? 'zh-CN' : 'en-US', {hour:'2-digit', minute:'2-digit'}),
            mealType: mealType()
          });
          entries.unshift(entry);
          added++;
        } catch (error) { console.warn('Photo upload failed:', file.name, error); }
      }
      event.target.value = '';
      if (added) {
        pageIndex = 0;
        render(); showToast();
      } else { alert(copy[language].uploadError); }
      button.disabled = false; button.textContent = copy[language].upload;
    };

    $('#clearBtn').onclick = async () => {
      if (!currentUser) { openAuth(); return; }
      if (!entries.length || !confirm(copy[language].confirm)) return;
      try {
        const paths = entries.map(entry => entry.storagePath).filter(Boolean);
        if (paths.length) {
          const { error: storageError } = await cloud.storage.from('journal-photos').remove(paths);
          if (storageError) throw storageError;
        }
        const { error } = await cloud.from('journal_entries').delete().eq('user_id', currentUser.id);
        if (error) throw error;
        entries = []; render();
      } catch (error) { console.error(error); alert(copy[language].storageError); }
    };

    $('#prevPage').onclick = () => { pageIndex = Math.min(pageIndex + 1, getPages().length - 1); render(); };
    $('#nextPage').onclick = () => { pageIndex = Math.max(pageIndex - 1, 0); render(); };

    function mealType() {
      const h = new Date().getHours();
      return h < 10 ? 0 : h < 14 ? 1 : h < 17 ? 2 : 3;
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const timeout = setTimeout(() => { URL.revokeObjectURL(img.src); reject(new Error('Image decode timed out')); }, 15000);
        img.onload = () => {
          clearTimeout(timeout);
          try {
            const max = 1600, scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.naturalWidth * scale)); canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
            canvas.getContext('2d', { alpha: false }).drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(img.src);
            const data = canvas.toDataURL('image/jpeg', .82);
            if (data === 'data:,') throw new Error('Canvas export failed');
            resolve(data);
          } catch (error) { reject(error); }
        };
        img.onerror = () => { clearTimeout(timeout); URL.revokeObjectURL(img.src); reject(new Error('Image decode failed')); };
        img.src = URL.createObjectURL(file);
      });
    }

    async function uploadCloudEntry(dataUrl, meta) {
      if (!currentUser) throw new Error('Login required');
      const id = crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const path = `${currentUser.id}/${id}.jpg`;
      const blob = await fetch(dataUrl).then(response => response.blob());
      const { error: uploadError } = await cloud.storage.from('journal-photos').upload(path, blob, {
        contentType: 'image/jpeg', cacheControl: '3600', upsert: false
      });
      if (uploadError) throw uploadError;
      const { data: row, error: rowError } = await cloud.from('journal_entries').insert({
        user_id: currentUser.id,
        storage_path: path,
        entry_date: meta.date,
        entry_time: meta.time,
        moment_type: meta.mealType
      }).select().single();
      if (rowError) {
        await cloud.storage.from('journal-photos').remove([path]);
        throw rowError;
      }
      return { id: row.id, data: dataUrl, date: row.entry_date, time: row.entry_time, mealType: row.moment_type, storagePath: path };
    }

    async function loadCloudEntries() {
      if (!currentUser) return;
      const { data: rows, error } = await cloud.from('journal_entries').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      entries = await Promise.all(rows.map(async row => {
        const { data, error: urlError } = await cloud.storage.from('journal-photos').createSignedUrl(row.storage_path, 86400);
        if (urlError) throw urlError;
        return { id: row.id, data: data.signedUrl, date: row.entry_date, time: row.entry_time, mealType: row.moment_type, storagePath: row.storage_path };
      }));
      pageIndex = 0; render();
    }

    async function migrateLocalEntries() {
      if (!currentUser || !localEntries.length) return;
      $('#authStatus').textContent = language === 'zh' ? `正在迁移 ${localEntries.length} 张旧照片…` : `Moving ${localEntries.length} local photos…`;
      const remaining = [];
      for (const entry of localEntries) {
        try { await uploadCloudEntry(entry.data, { date: entry.date || todayKey, time: entry.time, mealType: entry.mealType ?? 1 }); }
        catch (error) { console.warn('Local photo migration failed:', error); remaining.push(entry); }
      }
      localEntries = remaining;
      await saveLocalEntries(remaining);
      await loadCloudEntries();
      $('#authStatus').textContent = remaining.length
        ? (language === 'zh' ? `${remaining.length} 张旧照片迁移失败，请稍后重新登录重试。` : `${remaining.length} photos could not be moved. Try again later.`)
        : (language === 'zh' ? '旧照片已安全迁移到云端。' : 'Local photos are now safely in the cloud.');
    }

    function openDiaryDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('little-keeps-diary', 1);
        request.onupgradeneeded = () => request.result.createObjectStore('journal');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveLocalEntries(values) {
      const db = await openDiaryDb();
      await new Promise((resolve, reject) => {
        const transaction = db.transaction('journal', 'readwrite');
        transaction.objectStore('journal').put(values.slice(0, 100), 'entries');
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
      db.close();
      localStorage.removeItem(STORAGE_KEY);
    }

    async function loadSavedEntries() {
      try {
        const db = await openDiaryDb();
        const saved = await new Promise((resolve, reject) => {
          const request = db.transaction('journal').objectStore('journal').get('entries');
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        db.close();
        if (saved?.length) entries = saved;
        else if (entries.length) await saveLocalEntries(entries);
        localEntries = [...entries];
        render();
      } catch (error) { console.warn('Diary storage unavailable:', error); }
    }

    function openAuth() { $('#authModal').classList.add('open'); }
    function closeAuth() { $('#authModal').classList.remove('open'); }
    $('#accountBtn').onclick = openAuth;
    $('#authClose').onclick = closeAuth;
    $('#authModal').onclick = event => { if (event.target === $('#authModal')) closeAuth(); };
    let authMode = 'signin';
    $('#rememberLogin').checked = localStorage.getItem('remember-cloud-login') !== 'false';
    $('#authMode').onclick = () => { authMode = authMode === 'signin' ? 'signup' : 'signin'; updateAccountUi(); };
    $('#recoverMode').onclick = () => { authMode = authMode === 'recover' ? 'signin' : 'recover'; $('#authStatus').textContent = ''; updateAccountUi(); };
    $('#authForm').onsubmit = async event => {
      event.preventDefault();
      const button = $('#authSubmit'), email = $('#emailInput').value.trim(), password = $('#passwordInput').value;
      localStorage.setItem('remember-cloud-login', $('#rememberLogin').checked ? 'true' : 'false');
      button.disabled = true;
      $('#authStatus').textContent = language === 'zh' ? '正在连接云端…' : 'Connecting…';
      let data, error;
      if (authMode === 'signin') ({ data, error } = await cloud.auth.signInWithPassword({ email, password }));
      else if (authMode === 'signup') ({ data, error } = await cloud.auth.signUp({ email, password }));
      else if (authMode === 'recover') ({ data, error } = await cloud.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }));
      else ({ data, error } = await cloud.auth.updateUser({ password }));
      button.disabled = false;
      if (error) $('#authStatus').textContent = error.message;
      else if (authMode === 'recover') $('#authStatus').textContent = language === 'zh' ? '设置密码的邮件已发送。打开邮件中的链接，再回到这里输入新密码。' : 'Password setup email sent. Open the link, then return here to choose a password.';
      else if (authMode === 'update') {
        authMode = 'signin';
        $('#authStatus').textContent = language === 'zh' ? '新密码设置成功，今后可以直接登录。' : 'Your new password is ready.';
        updateAccountUi();
      }
      else if (data.session) $('#authStatus').textContent = language === 'zh' ? '登录成功，正在读取照片…' : 'Signed in. Loading photos…';
      else $('#authStatus').textContent = language === 'zh' ? '账号已创建，但项目仍要求邮箱确认。请先在 Supabase 关闭 Confirm email。' : 'Account created, but email confirmation is still enabled in Supabase.';
    };
    $('#signoutBtn').onclick = async () => { await cloud.auth.signOut(); closeAuth(); };

    function updateAccountUi() {
      const c = copy[language];
      $('#accountBtn').textContent = currentUser ? c.loggedIn : c.login;
      $('#accountBtn').classList.toggle('signed-in', !!currentUser);
      $('#authForm').hidden = !!currentUser;
      if (authMode === 'update') $('#authForm').hidden = false;
      $('#signoutBtn').hidden = !currentUser;
      $('#authIntro').textContent = currentUser
        ? currentUser.email
        : (language === 'zh' ? '使用邮箱和密码登录，照片只对你可见。' : 'Sign in with email and password. Your photos stay private.');
      const titles = language === 'zh' ? { signin:'登录云端手账', signup:'创建云端账号', recover:'找回你的账号', update:'设置新密码' } : { signin:'Sign in to your journal', signup:'Create your account', recover:'Recover your account', update:'Choose a new password' };
      const submits = language === 'zh' ? { signin:'登录', signup:'创建账号', recover:'发送设置密码邮件', update:'保存新密码' } : { signin:'Sign in', signup:'Create account', recover:'Send password email', update:'Save new password' };
      $('#authTitle').textContent = titles[authMode];
      $('#authSubmit').textContent = submits[authMode];
      $('#authMode').textContent = language === 'zh' ? (authMode === 'signup' ? '已经有账号？返回登录' : '第一次使用？创建账号') : (authMode === 'signup' ? 'Already registered? Sign in' : 'New here? Create account');
      $('#recoverMode').textContent = language === 'zh' ? (authMode === 'recover' ? '返回登录' : '已有邮箱账号？设置或忘记密码') : (authMode === 'recover' ? 'Back to sign in' : 'Set or forgot your password');
      $('#emailInput').hidden = authMode === 'update';
      $('#emailInput').required = authMode !== 'update';
      $('#passwordInput').hidden = authMode === 'recover';
      $('#passwordInput').required = authMode !== 'recover';
      $('.remember-row').hidden = authMode === 'recover' || authMode === 'update';
      $('#authMode').hidden = authMode === 'recover' || authMode === 'update';
      $('#recoverMode').hidden = authMode === 'update';
      $('#rememberLabel').textContent = language === 'zh' ? '记住登录状态' : 'Remember me';
    }

    async function initCloud() {
      const { data: { session } } = await cloud.auth.getSession();
      currentUser = session?.user || null;
      updateAccountUi();
      if (currentUser) { await migrateLocalEntries(); if (!localEntries.length) await loadCloudEntries(); }
      cloud.auth.onAuthStateChange((event, session) => {
        currentUser = session?.user || null;
        if (event === 'PASSWORD_RECOVERY') { authMode = 'update'; openAuth(); }
        updateAccountUi();
        if (event === 'SIGNED_IN') setTimeout(async () => { await migrateLocalEntries(); if (!localEntries.length) await loadCloudEntries(); if (authMode !== 'update') closeAuth(); }, 0);
        if (event === 'SIGNED_OUT') { entries = []; render(); }
      });
    }

    function getPages() { return [...new Set([todayKey, ...entries.map(e => e.date)])].sort().reverse(); }

    function formatDate(key, short = false) {
      const d = new Date(key + 'T12:00:00');
      return new Intl.DateTimeFormat(language === 'zh' ? 'zh-CN' : 'en-US', short ? {month:'long', day:'numeric', weekday:'long'} : {year:'numeric', month:'long', day:'numeric', weekday:'long'}).format(d);
    }

    function render() {
      const c = copy[language], pages = getPages();
      pageIndex = Math.min(pageIndex, pages.length - 1);
      const activeDate = pages[pageIndex], pageEntries = entries.filter(e => e.date === activeDate);
      document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
      document.querySelector('.brand span').textContent = c.brand;
      $('#langBtn').textContent = language === 'zh' ? 'EN' : '中文';
      $('#today').textContent = formatDate(todayKey, true);
      $('#heroTitle').innerHTML = c.title; $('#intro').textContent = c.intro;
      $('#todayLabel').textContent = c.today; $('#totalLabel').textContent = c.total;
      $('#doodleText').textContent = c.doodle; $('#uploadBtn').textContent = c.upload;
      updateAccountUi();
      $('#installBtn span').textContent = c.install;
      $('#pageDate').textContent = formatDate(activeDate); $('#pageSubtitle').textContent = c.subtitle;
      $('#clearBtn').textContent = c.clear; $('#toast').textContent = c.toast;
      $('#pageCount').textContent = c.page.replace('{n}', pageIndex + 1).replace('{all}', pages.length);
      $('#prevPage').disabled = pageIndex === pages.length - 1; $('#nextPage').disabled = pageIndex === 0;
      $('#todayCount').textContent = entries.filter(e => e.date === todayKey).length;
      $('#totalCount').textContent = entries.length;
      if (!pageEntries.length) {
        $('#meals').innerHTML = `<div class="empty"><div><b>${c.emptyTitle}</b>${c.emptyBody}</div></div>`;
        return;
      }
      $('#meals').innerHTML = pageEntries.map((e, i) => `
        <article class="meal-card" style="animation-delay:${i * .07}s">
          <div class="photo-wrap">
            <img src="${e.data}" alt="life journal photo" />
            <span class="tag">${c.meals[e.mealType ?? 1]}</span>
            <button class="delete" data-id="${e.id}" aria-label="delete">×</button>
          </div>
          <div class="caption"><strong>${c.caption}</strong><time>${e.time}</time></div>
        </article>`).join('');
      document.querySelectorAll('.delete').forEach(btn => btn.onclick = async () => {
        const entry = entries.find(item => item.id === btn.dataset.id);
        if (!entry || !currentUser) return;
        btn.disabled = true;
        try {
          const { error: storageError } = await cloud.storage.from('journal-photos').remove([entry.storagePath]);
          if (storageError) throw storageError;
          const { error } = await cloud.from('journal_entries').delete().eq('id', entry.id);
          if (error) throw error;
          entries = entries.filter(item => item.id !== entry.id); render();
        } catch (error) { console.error(error); btn.disabled = false; alert(copy[language].storageError); }
      });
      document.querySelectorAll('.photo-wrap').forEach(wrap => wrap.onclick = event => {
        if (event.target.closest('.delete')) return;
        const photo = wrap.querySelector('img');
        $('#lightboxPhoto').src = photo.src;
        $('#lightboxPhoto').alt = photo.alt;
        $('#lightbox').classList.add('open');
        document.body.classList.add('photo-open');
      });
    }

    function showToast() {
      $('#toast').classList.add('show');
      setTimeout(() => $('#toast').classList.remove('show'), 1900);
    }
    let installPrompt;
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault(); installPrompt = event; $('#installBtn').classList.add('ready');
    });
    $('#installBtn').onclick = async () => {
      if (!installPrompt) return;
      installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; $('#installBtn').classList.remove('ready');
    };
    window.addEventListener('appinstalled', () => $('#installBtn').classList.remove('ready'));
    function closePhoto() {
      $('#lightbox').classList.remove('open'); document.body.classList.remove('photo-open');
      setTimeout(() => { if (!$('#lightbox').classList.contains('open')) $('#lightboxPhoto').removeAttribute('src'); }, 230);
    }
    $('#lightboxClose').onclick = closePhoto;
    $('#lightbox').onclick = event => { if (event.target === $('#lightbox')) closePhoto(); };
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closePhoto(); });
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    render();
    (async () => { await loadSavedEntries(); await initCloud(); })();
  </script>
</body>
</html>
